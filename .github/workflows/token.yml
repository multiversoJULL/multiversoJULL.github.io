name: Actualizar precio del token

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Consultar precios
        run: python scripts/update_token.py
      - name: Guardar cambios
        run: |
          git config user.name "jullverse-bot"
          git config user.email "multiversojull@users.noreply.github.com"
          git add data/token.json
          if git diff --cached --quiet; then
            echo "sin cambios"
          else
            git commit -m "Token: precios actualizados $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
